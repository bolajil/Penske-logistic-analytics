# Cloud Build configuration for Penske Logistics Analytics
# Triggers: Push to main branch
# Actions: Test, Build, Deploy to Cloud Run

steps:
  # Step 1: Run Tests
  - name: 'python:3.11-slim'
    id: 'test'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --quiet -r requirements.txt
        pip install --quiet pytest pytest-cov
        python -m src.data_generator
        pytest tests/ -v --cov=src --cov-report=term-missing || true

  # Step 2: Build Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/penske-analytics/penske-analytics:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/penske-analytics/penske-analytics:latest'
      - '-f'
      - 'deploy/Dockerfile'
      - '.'

  # Step 3: Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/penske-analytics/penske-analytics'

  # Step 4: Deploy API to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-api'
    args:
      - 'run'
      - 'deploy'
      - 'penske-api'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/penske-analytics/penske-analytics:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--port=8000'
      - '--memory=2Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--timeout=300'
      - '--set-env-vars=PYTHONPATH=/app'
      - '--allow-unauthenticated'

  # Step 5: Deploy Dashboard to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-dashboard'
    args:
      - 'run'
      - 'deploy'
      - 'penske-dashboard'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/penske-analytics/penske-analytics:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--port=8501'
      - '--memory=2Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--timeout=300'
      - '--set-env-vars=PYTHONPATH=/app'
      - '--command=streamlit'
      - '--args=run,app/streamlit_dashboard.py,--server.port=8501,--server.address=0.0.0.0'
      - '--allow-unauthenticated'

  # Step 6: Output deployment URLs
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'get-urls'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "============================================"
        echo "DEPLOYMENT COMPLETE!"
        echo "============================================"
        echo "API URL: $(gcloud run services describe penske-api --region=${_REGION} --format='value(status.url)')"
        echo "Dashboard URL: $(gcloud run services describe penske-dashboard --region=${_REGION} --format='value(status.url)')"
        echo "============================================"

# Substitution variables
substitutions:
  _REGION: us-central1

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Images to store in Artifact Registry
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/penske-analytics/penske-analytics:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/penske-analytics/penske-analytics:latest'

# Build timeout (20 minutes)
timeout: '1200s'
