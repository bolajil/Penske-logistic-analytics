apiVersion: apps/v1
kind: Deployment
metadata:
  name: penske-analytics-api
  labels:
    app: penske-analytics
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: penske-analytics
      component: api
  template:
    metadata:
      labels:
        app: penske-analytics
        component: api
    spec:
      containers:
      - name: api
        image: penske-logistics-analytics:latest
        ports:
        - containerPort: 8000
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: penske-secrets
              key: openai-api-key
        - name: PYTHONPATH
          value: "/app"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: penske-analytics-dashboard
  labels:
    app: penske-analytics
    component: dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: penske-analytics
      component: dashboard
  template:
    metadata:
      labels:
        app: penske-analytics
        component: dashboard
    spec:
      containers:
      - name: dashboard
        image: penske-logistics-analytics:latest
        command: ["streamlit", "run", "app/streamlit_dashboard.py"]
        ports:
        - containerPort: 8501
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: penske-secrets
              key: openai-api-key
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
