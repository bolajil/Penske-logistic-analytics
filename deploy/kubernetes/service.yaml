apiVersion: v1
kind: Service
metadata:
  name: penske-analytics-api
  labels:
    app: penske-analytics
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: penske-analytics
    component: api
---
apiVersion: v1
kind: Service
metadata:
  name: penske-analytics-dashboard
  labels:
    app: penske-analytics
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8501
    protocol: TCP
    name: http
  selector:
    app: penske-analytics
    component: dashboard
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: penske-analytics-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - analytics.penske.com
    secretName: penske-analytics-tls
  rules:
  - host: analytics.penske.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: penske-analytics-api
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: penske-analytics-dashboard
            port:
              number: 80
